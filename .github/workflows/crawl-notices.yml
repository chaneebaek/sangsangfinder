name: Crawl Hansung notices

on:
  schedule:
    # KST Mon-Fri 09:17-17:17 == UTC Mon-Fri 00:17-08:17.
    # GitHub Actions scheduled events are best-effort and can be delayed a few minutes.
    - cron: "17 0-8 * * 1-5"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-crawl.txt

      - name: Install crawler dependencies
        run: python -m pip install -r requirements-crawl.txt

      - name: Validate required secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is empty or missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ "$SUPABASE_DB_URL" != postgresql://* && "$SUPABASE_DB_URL" != postgres://* ]]; then
            echo "::error::SUPABASE_DB_URL must start with postgresql:// or postgres://"
            exit 1
          fi
          if [ -z "$PINECONE_API_KEY" ]; then
            echo "::error::PINECONE_API_KEY secret is empty or missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "SUPABASE_DB_URL is configured."
          echo "PINECONE_API_KEY is configured."

      - name: Crawl, save to Supabase, and index to Pinecone
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          VECTOR_DB: pinecone
        run: python crawling/auto_crawler.py --storage supabase --init-db --max-pages 2
