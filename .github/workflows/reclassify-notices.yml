name: Reclassify Hansung notices

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Start date, inclusive
        required: true
        default: "2026-05-19"
      end_date:
        description: End date, inclusive
        required: true
        default: "2026-05-29"
      limit:
        description: Optional maximum number of notices
        required: false
        default: ""
      all:
        description: Reclassify all rows in range, not just fallback rows
        required: false
        type: boolean
        default: false

jobs:
  reclassify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-crawl.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-crawl.txt

      - name: Reclassify notices
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          args=(
            --start-date "${{ inputs.start_date }}"
            --end-date "${{ inputs.end_date }}"
          )
          if [ -n "${{ inputs.limit }}" ]; then
            args+=(--limit "${{ inputs.limit }}")
          fi
          if [ "${{ inputs.all }}" = "true" ]; then
            args+=(--all)
          fi
          python scripts/reclassify_supabase_notices.py "${args[@]}"
