name: Backfill Pinecone from Supabase

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Optional notice year to scan, e.g. 2026"
        required: false
        type: string
      limit:
        description: "Optional max Supabase rows to scan"
        required: false
        type: string
      all:
        description: "Re-run all loaded notices through indexing instead of only missing vectors"
        required: false
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-crawl.txt

      - name: Install indexing dependencies
        run: python -m pip install -r requirements-crawl.txt

      - name: Validate required secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is empty or missing."
            exit 1
          fi
          if [ -z "$PINECONE_API_KEY" ]; then
            echo "::error::PINECONE_API_KEY secret is empty or missing."
            exit 1
          fi

      - name: Backfill missing Pinecone vectors
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          VECTOR_DB: pinecone
        run: |
          args=()
          if [ -n "${{ inputs.year }}" ]; then
            args+=(--year "${{ inputs.year }}")
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            args+=(--limit "${{ inputs.limit }}")
          fi
          if [ "${{ inputs.all }}" = "true" ]; then
            args+=(--all)
          fi
          python scripts/index_supabase_to_pinecone.py "${args[@]}"
